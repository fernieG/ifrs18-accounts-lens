name: Verify Accounts Lens

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify dataset, extractor and reproducible HTML
        run: python3 -m unittest discover -v
      - name: Smoke test page generation
        run: python3 build.py afklm_h1_2026.json /tmp/accounts-lens-smoke.html
