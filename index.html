@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a20;--surface:#15242c;--ink:#e6eef0;--muted:#92a6ae;--line:#27393f;--accent:#4fc1b8;--accent-soft:#17383b;--pos:#46b68d;--neg:#e0795c;--warn:#e0b45a;--warn-soft:#3a3118;--neg-soft:#40231c;--pos-soft:#173a2d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a20;--surface:#15242c;--ink:#e6eef0;--muted:#92a6ae;--line:#27393f;--accent:#4fc1b8;--accent-soft:#17383b;--pos:#46b68d;--neg:#e0795c;--warn:#e0b45a;--warn-soft:#3a3118;--neg-soft:#40231c;--pos-soft:#173a2d;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1040px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0;max-width:62ch}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.btn,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.panel h2{font-size:13px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.panel p.hint{margin:0 0 12px;color:var(--muted);max-width:70ch}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.meta div{min-width:0}.meta dt{font-size:12px;color:var(--muted)}.meta dd{margin:0;overflow-wrap:anywhere}
.meta a{color:var(--accent)}
nav[role=tablist]{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);margin-bottom:-1px}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.grp td{background:var(--bg);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
tr.sub td{font-weight:600;border-top:1px solid var(--ink)}
tr.memo td:first-child{padding-left:24px;color:var(--muted)}
.neg{color:var(--neg)}
.note{display:block;color:var(--muted);font-size:12px;font-weight:400;max-width:58ch}
.chip{display:inline-flex;gap:4px;align-items:center;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:500}
.chip.ok{background:var(--pos-soft);color:var(--pos)}.chip.bad{background:var(--neg-soft);color:var(--neg)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.ltm{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:12px}
.ltm input{width:120px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-family:var(--mono)}
.banner{padding:10px 12px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
svg text{fill:var(--ink);font-family:var(--sans)}
svg .m{fill:var(--muted)}
.foot{color:var(--muted);font-size:12px;max-width:80ch}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .15s}}
</style>

   fn:i => i === 0 ? div((val("cf_before_wc",0) ?? NaN) + (val("int_paid",0) ?? NaN) + (val("int_recv",0) ?? NaN), val("net_debt",0)) : null,
   note:"Interest paid is already negative in the cash flow statement."},
 {id:"cxd", name:"Capex / depreciation and amortization", f:"Purchase of PP&E and intangibles / amortization, depreciation and provisions", fmt:"x", fn:i => div(val("capex",i) == null ? null : -val("capex",i), val("da",i))}
];

/* ---------- integrity checks ---------- */
function sum(rows, pred, i) { return rows.filter(pred).reduce((a, r) => a + r.v[i], 0); }
function integrity() {
  const out = [], is = D.income_statement || [], bs = D.balance_sheet || [], cf = D.cash_flow || [];
  const add = (name, got, want) => out.push({name, got, want, pass: got === want});
  const P = D.periods || {flow:["Current","Comparative"], stock:["Current","Comparative"]};
  const g = (arr, k, i) => (arr.find(r => r.key === k) || {v:[null,null]}).v[i];
  [0,1].forEach(i => {
    const L = P.flow[i];
    if (is.length) {
      add(`Operating lines sum to operating profit, ${L}`, sum(is, r => r.cat === "operating" && !r.memo, i), g(is,"op_profit",i));
      add(`Operating profit + investing = profit before financing and tax, ${L}`, g(is,"op_profit",i) + sum(is, r => r.cat === "investing", i), g(is,"pbfit",i));
      add(`Profit before financing and tax + financing = profit before tax, ${L}`, g(is,"pbfit",i) + sum(is, r => r.cat === "financing", i), g(is,"pbt",i));
      add(`Profit before tax + income taxes = profit or loss, ${L}`, g(is,"pbt",i) + g(is,"tax",i), g(is,"net",i));
      add(`Group part + non-controlling interests = profit or loss, ${L}`, g(is,"group",i) + g(is,"nci",i), g(is,"net",i));
    }
    if (cf.length) {
      add(`Operating lines sum to cash flow before working capital, ${L}`, sum(cf, r => r.cat === "operating", i), g(cf,"cf_before_wc",i));
      add(`Investing lines sum to net investing cash flow, ${L}`, sum(cf, r => r.cat === "investing", i), g(cf,"cfi",i));
      add(`Financing lines sum to net financing cash flow, ${L}`, sum(cf, r => r.cat === "financing", i), g(cf,"cff",i));
      add(`Operating + investing + financing + FX = change in cash, ${L}`, g(cf,"cfo",i) + g(cf,"cfi",i) + g(cf,"cff",i) + g(cf,"fx_cash",i), g(cf,"cash_change",i));
    }
    if (is.length && cf.length) add(`Cash flow starts from the income-statement operating profit, ${L}`, g(cf,"cf_op_profit",i), g(is,"op_profit",i));
  });
  [0,1].forEach(i => {
    const L = P.stock[i];
    if (!bs.length) return;
    add(`Non-current assets add up, ${L}`, sum(bs, r => r.sec === "nca", i), g(bs,"total_nca",i));
    add(`Current assets add up, ${L}`, sum(bs, r => r.sec === "ca", i), g(bs,"total_ca",i));
    add(`Non-current liabilities add up, ${L}`, sum(bs, r => r.sec === "ncl", i), g(bs,"total_ncl",i));
    add(`Current liabilities add up, ${L}`, sum(bs, r => r.sec === "cl", i), g(bs,"total_cl",i));
    add(`Assets = liabilities + equity, ${L}`, g(bs,"total_assets",i), g(bs,"total_ncl",i) + g(bs,"total_cl",i) + g(bs,"equity",i));
  });
  if (D.mpm && D.mpm.net_debt && D.mpm.gross_financial_liabilities && D.mpm.net_cash)
    [0,1].forEach(i => add(`Net debt = gross financial liabilities − net cash, ${(P.stock||[])[i]}`, D.mpm.gross_financial_liabilities[i] - D.mpm.net_cash[i], D.mpm.net_debt[i]));
  return out;
}

/* ---------- rendering ---------- */
const cell = (v, fmt) => { const t = FMT[fmt](v); return `<td class="n${v != null && v < 0 && fmt !== "pct" && fmt !== "x" ? " neg" : ""}">${t}</td>`; };

function renderRatios() {
  const P = D.periods, rep = D.mpm && D.mpm.reported_leverage;
  let h = `<div class="ltm"><label for="ltm">Last-12-month adjusted EBITDA (EUR m)</label><input id="ltm" inputmode="numeric" placeholder="optional" value="${ltm ?? ""}">
  ${rep ? `<span class="note" style="max-width:none">Reported by the issuer: ${rep.value.toFixed(1)}x (${esc(rep.basis)}; ${esc(rep.source)}). The 12-month EBITDA is not in the half-year statements.</span>` : ""}</div>
  <div class="scroll"><table><thead><tr><th>Ratio</th><th class="n">${esc(P.flow[0])}</th><th class="n">${esc(P.flow[1])}</th><th>Definition</th></tr></thead><tbody>`;
  for (const r of RATIOS) {
    if (r.g) { h += `<tr class="grp"><td colspan="4">${r.g}</td></tr>`; continue; }
    const a = r.fn(0), b = r.fn(1);
    h += `<tr><td>${esc(r.name)}${r.stock ? " †" : ""}</td>${cell(a, r.fmt)}${cell(b, r.fmt)}<td>${esc(r.f)}${r.note ? `<span class="note">${esc(r.note)}</span>` : ""}</td></tr>`;
  }
  return h + `</tbody></table></div><p class="foot">† Balance-sheet ratio: the current column uses ${esc(P.stock[0])}, the comparative column uses ${esc(P.stock[1])}. A dash means the inputs are not in the filing or the ratio has no like-for-like comparative.</p>`;
}

function renderStatement(sec, cols, groups) {
  const rows = D[sec] || [];
  if (!rows.length) return `<p class="hint">This dataset has no ${sec.replace("_"," ")}.</p>`;
  let h = `<div class="scroll"><table><thead><tr><th>Line item</th>${cols.map(c => `<th class="n">${esc(c)}</th>`).join("")}<th class="n">Change</th></tr></thead><tbody>`, last = null;
  for (const r of rows) {
    const k = r.cat || r.sec || r.subtotal;
    if (!r.subtotal && groups[k] && groups[k] !== last) { last = groups[k]; h += `<tr class="grp"><td colspan="4">${esc(last)}</td></tr>`; }
    const d = r.v[0] != null && r.v[1] != null ? r.v[0] - r.v[1] : null;
    h += `<tr class="${r.subtotal ? "sub" : ""}${r.memo ? " memo" : ""}"><td>${esc(r.label)}</td>${cell(r.v[0],"eur")}${cell(r.v[1],"eur")}${cell(d,"eur")}</tr>`;
  }
  return h + "</tbody></table></div>";
}

function renderChecks() {
  const c = integrity(), bad = c.filter(x => !x.pass).length;
  let h = `<p class="hint">${bad ? `<span class="chip bad">${bad} failed</span> Re-check the extraction for these lines.` : `<span class="chip ok">All ${c.length} passed</span> Subtotals recompute from the lines above.`}</p><div class="scroll"><table><thead><tr><th>Check</th><th class="n">Computed</th><th class="n">Reported</th><th>Result</th></tr></thead><tbody>`;
  for (const x of c) h += `<tr><td>${esc(x.name)}</td><td class="n">${num(x.got)}</td><td class="n">${num(x.want)}</td><td><span class="chip ${x.pass ? "ok" : "bad"}">${x.pass ? "✓ Pass" : "✗ Fail"}</span></td></tr>`;
  return h + "</tbody></table></div>";
}

const TABS = [
 ["ratios","Credit ratios"], ["is","Income statement"], ["bs","Balance sheet"], ["cf","Cash flow"], ["checks","Checks"]
];
function renderView() {
  const P = D.periods;
  $("tabs").innerHTML = TABS.map(([k,l]) => `<button role="tab" type="button" data-k="${k}" aria-selected="${k===tab}">${l}</button>`).join("");
  $("view").innerHTML = ({
    ratios: renderRatios,
    is: () => renderStatement("income_statement", P.flow, {operating:"Operating", investing:"Investing", financing:"Financing", tax:"Income taxes", split:"Attribution"}),
    bs: () => renderStatement("balance_sheet", P.stock, {nca:"Non-current assets", ca:"Current assets", eq:"Equity", ncl:"Non-current liabilities", cl:"Current liabilities"}),
    cf: () => renderStatement("cash_flow", P.flow, {operating:"Operating", wc:"Working capital", investing:"Investing", financing:"Financing", fxcash:"Exchange effect"}),
    checks: renderChecks
  })[tab]();
  const inp = $("ltm");
  if (inp) inp.addEventListener("change", () => { const n = parseFloat(inp.value.replace(/[ ,]/g, "")); ltm = Number.isFinite(n) && n > 0 ? n : null; renderView(); $("ltm").focus(); });
}

function renderWaterfall() {
  const g = k => (D.income_statement.find(r => r.key === k) || {v:[null]}).v[0];
  const steps = [["Operating", g("op_profit")], ["Investing", g("pbfit") - g("op_profit")], ["Financing", g("pbt") - g("pbfit")], ["Income taxes", g("tax")]];
  if (steps.some(s => !ok(s[1])) || !ok(g("net"))) { $("wf").innerHTML = '<p class="hint">Needs operating profit, the three subtotals, taxes and profit or loss.</p>'; return; }
  const bars = []; let run = 0;
  steps.forEach(([l, v]) => { bars.push({l, v, a: run, b: run + v}); run += v; });
  bars.push({l:"Profit or loss", v:g("net"), a:0, b:g("net"), total:true});
  const lo = Math.min(0, ...bars.flatMap(b => [b.a, b.b])), hi = Math.max(0, ...bars.flatMap(b => [b.a, b.b]));
  const W = 640, H = 250, L = 8, R = 8, T = 28, B = 36, bw = 64, gap = (W - L - R - bw * 5) / 4;
  const y = v => T + (hi - v) / (hi - lo || 1) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Waterfall from operating profit through investing, financing and taxes to profit or loss" style="width:100%;height:auto;max-width:100%">`;
  s += `<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-width="1"/>`;
  bars.forEach((b, i) => {
    const x = L + i * (bw + gap), top = y(Math.max(b.a, b.b)), h = Math.max(2, Math.abs(y(b.a) - y(b.b)));
    const fill = b.total ? "var(--accent)" : (b.v >= 0 ? "var(--pos)" : "var(--neg)");
    s += `<rect x="${x}" y="${top}" width="${bw}" height="${h}" rx="3" fill="${fill}"/>`;
    const lab = (b.v > 0 && !b.total ? "+" : "") + num(b.v);
    const above = b.v >= 0;
    s += `<text x="${x + bw/2}" y="${above ? top - 6 : top + h + 14}" text-anchor="middle" font-size="12" style="font-family:var(--mono)">${lab}</text>`;
    s += `<text x="${x + bw/2}" y="${H - 12}" text-anchor="middle" font-size="12" class="m" style="fill:var(--muted)">${esc(b.l)}</text>`;
    if (i < 4) s += `<line x1="${x + bw}" x2="${x + bw + gap}" y1="${y(b.b)}" y2="${y(b.b)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>`;
  });
  $("wf").innerHTML = s + "</svg>";
  $("wfhint").textContent = `${D.periods.flow[0]}, EUR millions. IFRS 18 splits every result into operating, investing and financing, then taxes.`;
}

function renderHeader() {
  $("sub").textContent = `Company accounts and standard credit ratios under IFRS 18. Showing ${D.issuer}.`;
  const s = D.source;
  $("meta").innerHTML = [
    ["Issuer", D.issuer], ["Basis", D.standard || "IFRS 18"], ["Status", D.status || "–"], ["Unit", `${D.currency} ${D.unit}`],
    ["XBRL", D.xbrl ? (D.xbrl.available ? "Available in this file. " : "Not available in this file. ") + D.xbrl.evidence : "Not checked"],
    ["Source", s ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : "–"]
  ].map(([k, v]) => `<div><dt>${k}</dt><dd>${k === "Source" ? v : esc(v)}</dd></div>`).join("");
  $("foot").textContent = "Figures are transcribed from the issuer's own filing. Ratios and the waterfall are computed in this page; adjusted EBITDA, adjusted operating profit, net debt and operating free cash flow are the issuer's management-defined measures, taken as reported.";
}

function render() { renderHeader(); renderWaterfall(); renderView(); }

$("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-k]"); if (b) { tab = b.dataset.k; renderView(); } });
$("reset").addEventListener("click", () => { D = DEFAULT; ltm = null; $("msg").hidden = true; render(); });
$("file").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result);
      if (!j.income_statement || !j.income_statement.length) throw new Error("no income_statement array");
      j.periods = j.periods || {flow:["Current","Comparative"], stock:["Current","Comparative"]};
      j.balance_sheet = j.balance_sheet || []; j.cash_flow = j.cash_flow || []; j.mpm = j.mpm || {};
      D = j; ltm = null; $("msg").hidden = true; render();
    } catch (err) { $("msg").hidden = false; $("msg").textContent = "Could not read that file: " + err.message + ". Use the JSON written by extract_ifrs18.py."; }
  };
  rd.readAsText(f); e.target.value = "";
});
render();
</script>
